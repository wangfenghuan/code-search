[project]
name = "code-search-graph"
version = "0.8.12"
description = "Fast, intelligent, multi-language code search and AST call graph MCP server for AI assistants (Python, TypeScript, JavaScript, Vue, Svelte, Go, Java, Rust)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "wangfenghuan", email = "wfenghuan@foxmail.com" }
]
requires-python = ">=3.10"
keywords = [
    "mcp",
    "model-context-protocol",
    "code-search",
    "code-graph",
    "ast",
    "tree-sitter",
    "vue",
    "ripgrep",
    "lancedb",
    "vector-search",
    "call-graph",
    "code-navigation",
    "claude",
    "cursor",
    "cline",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    "fastembed>=0.3.0",
    "lancedb>=0.6.0",
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.12.0",
    "watchfiles>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/wangfenghuan/code-search"
Repository = "https://github.com/wangfenghuan/code-search"
Issues = "https://github.com/wangfenghuan/code-search/issues"
Documentation = "https://github.com/wangfenghuan/code-search#readme"
Changelog = "https://github.com/wangfenghuan/code-search/releases"

[project.scripts]
code-search-graph = "code_search_mcp.cli:main"
code-search-mcp = "code_search_mcp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["benchmark_repos", ".venv", "build", "dist"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "code_search_mcp"
source-exclude = [
    "src/code_search_mcp/models/**",
]

