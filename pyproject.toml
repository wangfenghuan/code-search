[project]
name = "code-search-mcp"
version = "0.1.0"
description = "Fast, intelligent, multi-language code search and AST call graph MCP server for AI assistants (Python, TypeScript, JavaScript, Go, Java, Rust)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "wangfenghuan", email = "wfenghuan@foxmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastembed>=0.3.0",
    "lancedb>=0.6.0",
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.12.0",
    "watchfiles>=1.3.0",
]

[project.scripts]
code-search-mcp = "code_search_mcp:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["benchmark_repos", ".venv", "build", "dist"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
