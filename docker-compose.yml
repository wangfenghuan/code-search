version: "3.8"

services:
  code-search-graph:
    build:
      context: .
      dockerfile: Dockerfile
    image: code-search-graph:latest
    container_name: code-search-graph
    stdin_open: true # Keep stdin open for MCP JSON-RPC stdio protocol
    tty: false
    volumes:
      # Mount target codebase into container (read-only)
      - ./:/workspace:ro
      # Persist vector and graph cache
      - code-search-cache:/root/.code-search-graph
    environment:
      - PYTHONUNBUFFERED=1
    command: ["serve"]

volumes:
  code-search-cache:
